name: saha
description: "Saha: kişisel antrenman takibi."
publish_to: 'none'
version: 1.5.1+8

environment:
  sdk: ^3.12.1

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  path_drawing: ^1.0.1
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
